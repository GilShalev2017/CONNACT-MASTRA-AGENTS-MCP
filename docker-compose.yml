services:
  mongodb:
    image: mongo:7
    container_name: connact-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: connact-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  crm-mcp-server:
    build: ./mcp-server
    container_name: connact-crm-mcp-server
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB_NAME: connact
      PORT: 4100
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "4100:4100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: connact-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/connact
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: connact_knowledge
      CRM_MCP_SERVER_URL: http://crm-mcp-server:4100/mcp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      EMBEDDING_MODEL: Xenova/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: 384
      KNOWLEDGE_DOCS_PATH: /app/data/knowledge-docs
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      crm-mcp-server:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./data/knowledge-docs:/app/data/knowledge-docs:ro

  frontend:
    build: ./frontend
    container_name: connact-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
  qdrant-data:
