<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:652px;height:1284px;background:#0F172A;" width="652px" height="1284px" viewBox="0 0 652 1284" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="652" height="1284" fill="#0F172A" style="stroke:none;"/><g class="title" data-source-line="1"><text x="176.863" y="32.995" fill="#E2E8F0" font-size="14" textLength="296.912" font-weight="700">RAG Pipeline: Ingestion and Retrieval</text></g><rect x="16" y="53.297" width="616.638" height="594.734" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M627.638,53.297 L627.638,62.594 L617.638,72.594 L16,72.594" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="67.292" fill="#E2E8F0" font-size="14" textLength="601.638">Ingestion (document upload, knowledge-base bootstrap, meeting transcript indexing)</text><ellipse cx="326.819" cy="92.594" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="259.06" y="122.594" width="135.518" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="269.06" y="143.732" fill="#E2E8F0" font-size="12" textLength="105.838">Source document</text><text x="269.06" y="157.701" fill="#E2E8F0" font-size="12" textLength="115.518">(.md / .txt / .pdf) or</text><text x="269.06" y="171.67" fill="#E2E8F0" font-size="12" textLength="111.568">meeting transcript</text><rect x="248.496" y="204.5" width="156.646" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="258.496" y="225.639" fill="#E2E8F0" font-size="12" textLength="91.395">Text extraction</text><text x="258.496" y="239.607" fill="#E2E8F0" font-size="12" textLength="119.584">(pdf-parse for PDFs,</text><text x="258.496" y="253.576" fill="#E2E8F0" font-size="12" textLength="136.646">plain read for .md/.txt)</text><rect x="225.205" y="286.406" width="203.229" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="235.205" y="307.545" fill="#E2E8F0" font-size="12" textLength="56.701">Chunking</text><text x="235.205" y="321.514" fill="#E2E8F0" font-size="12" textLength="96.932">(sliding window,</text><text x="235.205" y="335.482" fill="#E2E8F0" font-size="12" textLength="183.229">~180 words, 30-word overlap)</text><rect x="239.179" y="368.313" width="175.279" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="249.179" y="389.451" fill="#E2E8F0" font-size="12" textLength="137.139">Embedding generation</text><text x="249.179" y="403.42" fill="#E2E8F0" font-size="12" textLength="155.279">(Xenova/all-MiniLM-L6-v2,</text><text x="249.179" y="417.389" fill="#E2E8F0" font-size="12" textLength="135.404">local, 384 dimensions)</text><rect x="206.065" y="450.219" width="241.508" height="75.875" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="216.065" y="471.357" fill="#E2E8F0" font-size="12" textLength="161.947">Upsert chunks + metadata</text><text x="216.065" y="485.326" fill="#E2E8F0" font-size="12" textLength="221.508">(source, customerId, documentType,</text><text x="216.065" y="499.295" fill="#E2E8F0" font-size="12" textLength="153.621">documentId, chunkIndex)</text><text x="216.065" y="513.264" fill="#E2E8F0" font-size="12" textLength="68.461">into Qdrant</text><rect x="209.894" y="546.094" width="233.85" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="219.894" y="567.232" fill="#E2E8F0" font-size="12" textLength="166.43">Persist document metadata</text><text x="219.894" y="581.201" fill="#E2E8F0" font-size="12" textLength="213.85">in MongoDB (documents collection)</text><ellipse cx="326.819" cy="625.031" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="326.819" cy="625.031" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="168.458" y="658.031" width="316.721" height="606.797" fill="none" style="stroke:#000;stroke-width:1.5;"/><path d="M396.58,658.031 L396.58,667.328 L386.58,677.328 L168.458,677.328" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="171.458" y="672.026" fill="#E2E8F0" font-size="14" textLength="218.121">Retrieval (at agent query time)</text><ellipse cx="326.819" cy="697.328" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="248.106" y="727.328" width="157.426" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="258.106" y="748.467" fill="#E2E8F0" font-size="12" textLength="137.426">Agent decides it needs</text><text x="258.106" y="762.436" fill="#E2E8F0" font-size="12" textLength="126.58">grounded knowledge</text><rect x="178.458" y="795.266" width="296.721" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="188.458" y="816.404" fill="#E2E8F0" font-size="12" textLength="161.848">searchKnowledgeBase tool</text><text x="188.458" y="830.373" fill="#E2E8F0" font-size="12" textLength="210.252">called with natural-language query</text><text x="188.458" y="844.342" fill="#E2E8F0" font-size="12" textLength="276.721">(+ optional customerId / documentType filter)</text><rect x="232.01" y="877.172" width="189.617" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="242.01" y="898.311" fill="#E2E8F0" font-size="12" textLength="169.617">Embed query with the same</text><text x="242.01" y="912.279" fill="#E2E8F0" font-size="12" textLength="140.818">local embedding model</text><rect x="221.223" y="945.109" width="211.191" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="231.223" y="966.248" fill="#E2E8F0" font-size="12" textLength="187.629">Qdrant cosine-similarity search</text><text x="231.223" y="980.217" fill="#E2E8F0" font-size="12" textLength="191.191">(top-K, optional metadata filter)</text><rect x="225.263" y="1013.047" width="203.111" height="61.906" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="235.263" y="1034.186" fill="#E2E8F0" font-size="12" textLength="132.656">Return ranked chunks</text><text x="235.263" y="1048.154" fill="#E2E8F0" font-size="12" textLength="183.111">(text, score, source metadata)</text><text x="235.263" y="1062.123" fill="#E2E8F0" font-size="12" textLength="74.033">to the agent</text><rect x="218.337" y="1094.953" width="216.963" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="228.337" y="1116.092" fill="#E2E8F0" font-size="12" textLength="196.963">Agent cites sources and grounds</text><text x="228.337" y="1130.061" fill="#E2E8F0" font-size="12" textLength="162.498">its answer in retrieved text</text><rect x="228.023" y="1162.891" width="197.592" height="47.938" fill="#1E293B" style="stroke:#3757F0;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="238.023" y="1184.029" fill="#E2E8F0" font-size="12" textLength="168.949">Frontend renders sources in</text><text x="238.023" y="1197.998" fill="#E2E8F0" font-size="12" textLength="177.592">the Agent Activity View panel</text><ellipse cx="326.819" cy="1241.828" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="326.819" cy="1241.828" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="326.819" y1="102.594" x2="326.819" y2="122.594" style="stroke:#181818;stroke-width:1;"/><polygon points="322.819,112.594,326.819,122.594,330.819,112.594,326.819,116.594" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="326.819" y1="184.5" x2="326.819" y2="204.5" style="stroke:#181818;stroke-width:1;"/><polygon points="322